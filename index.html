<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>PARP Future Camp matcher</title>
<style>
  :root{
    --bg:#fff; --card:#fff; --ink:#1a1a1a; --muted:#767676; --line:#e8e8e8;
    --accent:#c11f2c; --accent-soft:#fbe9ea;
    --get:#c11f2c; --get-soft:#fbe9ea;
    --give:#8f1620; --give-soft:#f7e1e2;
    --both:#5c0e15; --both-soft:#f2d9db;
    --r:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); padding:0 0 72px;
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
  .wrap{max-width:720px; margin:0 auto; padding:0 16px}
  h1{font-size:26px; line-height:1.2; margin:28px 0 8px; letter-spacing:-.02em}
  .sub{color:var(--muted); font-size:15px; margin:0 0 20px}
  .hide{display:none !important}

  textarea{width:100%; font:inherit; color:var(--ink); background:var(--card);
    border:1.5px solid var(--line); border-radius:var(--r); padding:15px 16px;
    outline:none; -webkit-appearance:none; min-height:104px; resize:vertical; line-height:1.5}
  textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(26,86,219,.12)}

  .go{width:100%; margin-top:10px; padding:14px; font:inherit; font-size:16px; font-weight:650;
    color:#fff; background:var(--accent); border:0; border-radius:var(--r); cursor:pointer}
  .go:disabled{opacity:.55; cursor:default}

  .chips{display:flex; gap:8px; overflow-x:auto; padding:14px 0 2px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; padding:7px 13px; font:inherit; font-size:13.5px; white-space:nowrap;
    cursor:pointer; background:var(--card); border:1px solid var(--line);
    border-radius:999px; color:var(--muted)}
  .chip:hover{border-color:var(--accent); color:var(--accent)}

  .note{font-size:13px; color:var(--muted); padding:14px 2px 4px}
  .cat-label{font-size:13px; color:var(--muted); padding:12px 2px 0}

  .load{text-align:center; padding:52px 16px; color:var(--muted)}
  .dots{display:inline-flex; gap:5px; margin-bottom:14px}
  .dots i{width:7px; height:7px; border-radius:50%; background:var(--accent); opacity:.3;
    animation:b 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,60%,100%{opacity:.25; transform:translateY(0)}30%{opacity:1; transform:translateY(-4px)}}

  .card{position:relative; background:var(--card); border:1px solid var(--line);
    border-radius:var(--r); padding:16px; margin-bottom:12px}
  .rank{position:absolute; top:15px; right:16px; font-size:12px; font-weight:700; color:#c9cdd3}
  .top{display:flex; gap:12px; padding-right:26px}
  .av{flex:0 0 auto; width:42px; height:42px; border-radius:50%; background:var(--accent-soft);
    color:var(--accent); display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px}
  .nm{font-weight:650; font-size:17.5px; letter-spacing:-.01em}
  .hl{color:var(--muted); font-size:14px; margin-top:2px}

  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
  .dir{font-size:12px; font-weight:650; padding:4px 9px; border-radius:7px}
  .dir.get{background:var(--get-soft); color:var(--get)}
  .dir.give{background:var(--give-soft); color:var(--give)}
  .dir.both{background:var(--both-soft); color:var(--both)}
  .kind{font-size:12px; font-weight:600; padding:4px 9px; border-radius:7px;
    background:var(--bg); color:var(--muted); border:1px solid var(--line)}

  .why{margin-top:11px; font-size:15px}
  .ask{margin-top:11px; font-size:14.5px; background:var(--bg); border-left:3px solid var(--accent);
    border-radius:0 8px 8px 0}
  .ask-toggle{display:block; width:100%; text-align:left; font:inherit; padding:10px 12px;
    background:none; border:0; cursor:pointer}
  .ask-toggle b{display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); font-weight:700}
  .ask-body{padding:0 12px 10px}
  .when{margin-top:10px; font-size:13px; color:var(--muted)}

  .acts{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
  .btn{flex:1 1 auto; min-width:130px; text-align:center; text-decoration:none; cursor:pointer;
    font:inherit; font-size:14px; font-weight:600; padding:11px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--ink)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn:active{transform:translateY(1px)}

  .err{background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; padding:14px;
    border-radius:var(--r); font-size:14.5px}
  .empty{text-align:center; color:var(--muted); padding:44px 16px; font-size:15px}
  .more{width:100%; margin-top:4px; padding:13px; font:inherit; font-size:14.5px; font-weight:600;
    color:var(--accent); background:var(--card); border:1.5px solid var(--accent); border-radius:var(--r); cursor:pointer}
  .more:disabled{opacity:.55; cursor:default}
  footer{color:var(--muted); font-size:12px; text-align:center; padding:30px 16px; line-height:1.7}
  footer a{color:var(--muted)}
  .creator-bar{position:fixed; left:12px; bottom:12px; display:flex; align-items:center;
    gap:6px; font-size:12px; color:var(--muted)}
  .creator-bar a{color:var(--muted); display:inline-flex}
  .creator-bar a:hover{color:var(--ink)}

  .self{margin-top:22px; padding-top:18px; border-top:1px solid var(--line)}
  .self h2{font-size:16px; margin:0 0 8px; letter-spacing:-.01em}
  .self textarea{min-height:76px}
  .self .go{background:var(--ink)}
  .self-toggle{padding:9px 16px; font-size:13.5px; font-weight:600; width:auto}
  .self-form{margin-top:10px}
  .self-li{width:100%; font:inherit; color:var(--ink); background:var(--card);
    border:1.5px solid var(--line); border-radius:var(--r); padding:13px 16px;
    outline:none; margin-top:8px}
  .self-li:focus{border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">

  <h1>PARP Future Camp matcher</h1>
  <p class="sub">Napisz czego szukasz, kogo potrzebujesz lub z kim chciałbyś się połączyć.</p>

  <textarea id="q" placeholder=""
            maxlength="500" enterkeyhint="search"></textarea>
  <button class="go" id="go">Szukaj</button>

  <div class="cat-label">Albo szukaj po kategorii biznesu:</div>
  <div class="chips" id="chips"></div>
  <div class="note" id="note"></div>

  <div class="self">
    <h2>Dodaj informacje o sobie</h2>
    <button class="go self-toggle" id="selfToggle">Dodaj siebie</button>
    <div class="self-form hide" id="selfForm">
      <textarea id="selfInfo" placeholder="Kim jesteś, czego szukasz, w czym możesz pomóc…" maxlength="500"></textarea>
      <input type="url" id="selfLinkedin" class="self-li" placeholder="Link do LinkedIn">
      <button class="go" id="selfGo">Dodaj siebie</button>
    </div>
  </div>

  <div id="out"></div>

  <footer>
    Dane: intro z grupy i publiczna agenda PARP.<br>
    Chcesz się dopisać albo zniknąć z listy? <a href="mailto:paweljuzekk@gmail.com?subject=Future%20Camp">Napisz do mnie</a>.
  </footer>

  <div class="creator-bar">
    By Paweł Juzek
    <a href="https://www.linkedin.com/in/pawe%C5%82-juzek/" target="_blank" rel="noopener" aria-label="LinkedIn Paweł Juzek">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.62 0 4.29 2.38 4.29 5.48v6.26zM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
    </a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = n => n.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function sub(p){
  const h = p.headline || '', c = p.company || '';
  if(!c) return h;
  if(!h) return c;
  return h.toLowerCase().includes(c.toLowerCase()) ? h : c + ' — ' + h;
}
const DIR = { get:'↓ Pomoże Tobie', give:'↑ Ty pomożesz jemu', both:'↔ Wspólny temat' };

const CHIPS = [
  'AI', 'B2B', 'B2C', 'Marketing', 'Sprzedaż', 'Hardware', 'SaaS',
  'Deep Tech', 'EdTech', 'HR Tech', 'HealthTech', 'FinTech', 'PropTech',
  'FemTech', 'E-commerce', 'Cybersecurity', 'Logistyka', 'FoodTech',
  'Mobile', 'Finansowanie i inwestycje',
];
$('chips').innerHTML = CHIPS.map(c => `<button class="chip" data-q="branża ${esc(c)}">${esc(c)}</button>`).join('');

let busy = false;

const STEPS = ['Czytam Twoje zapytanie…','Przeglądam 113 osób…','Szukam komplementarnych dopasowań…','Układam uzasadnienia…'];
function loading(){
  $('out').innerHTML = `<div class="load"><div class="dots"><i></i><i></i><i></i></div><div id="st">${STEPS[0]}</div></div>`;
  let i = 0;
  return setInterval(() => { const el = $('st'); if(el) el.textContent = STEPS[++i % STEPS.length]; }, 1900);
}

function card(p, i){
  const link = p.linkedin || p.url;
  return `<div class="card">
    <div class="rank">#${i+1}</div>
    <div class="top">
      <div class="av">${initials(p.name)}</div>
      <div style="min-width:0">
        <div class="nm">${esc(p.name)}</div>
        <div class="hl">${esc(sub(p))}</div>
      </div>
    </div>
    <div class="badges">
      <span class="dir ${p.fit}">${DIR[p.fit] || DIR.get}</span>
      <span class="kind">${p.kind === 'prelegent' ? 'prelegent / jury' : 'uczestnik'}</span>
    </div>
    <div class="why">${esc(p.why)}</div>
    ${p.desc ? `<div class="ask"><button class="ask-toggle" type="button"><b>O tej osobie</b></button><div class="ask-body hide">${esc(p.desc)}</div></div>` : ''}
    ${p.ask ? `<div class="ask"><button class="ask-toggle" type="button"><b>Przykładowe pytanie AI</b></button><div class="ask-body hide">${esc(p.ask)}</div></div>` : ''}
    ${p.raw ? `<div class="ask"><button class="ask-toggle" type="button"><b>Pełny tekst z WhatsAppa</b></button><div class="ask-body hide">${esc(p.raw)}</div></div>` : ''}
    ${p.session ? `<div class="when">${esc(p.session)}${p.when ? ' · ' + esc(p.when) : ''}</div>` : ''}
    <div class="acts">
      ${link ? `<a class="btn primary" href="${esc(link)}" target="_blank" rel="noopener">${p.linkedin ? 'LinkedIn →' : p.kind === 'prelegent' ? 'Profil PARP →' : 'Strona →'}</a>` : ''}
    </div>
  </div>`;
}

let shownIds = [];
const moreBtnHtml = `<button class="more" id="moreBtn">Pokaż inne dopasowania</button>`;

async function search(more){
  const q = $('q').value.trim();
  if(q.length < 3 || busy) return;
  if(!more) shownIds = [];
  busy = true; $('go').disabled = true;

  const oldMoreBtn = $('moreBtn');
  if(oldMoreBtn){ oldMoreBtn.disabled = true; oldMoreBtn.textContent = 'Szukam…'; }
  let spin = null;
  if(!more){ $('note').textContent = ''; document.querySelector('.self').classList.add('hide'); spin = loading(); window.scrollTo({ top: 260, behavior:'smooth' }); }

  try{
    const r = await fetch('/api/match', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ q, exclude: more ? shownIds : [] })
    });
    const d = await r.json();
    if(spin) clearInterval(spin);

    if(!r.ok){
      const diag = d.diagnostyka ? `<pre style="margin:10px 0 0; white-space:pre-wrap; font-size:12px; opacity:.85">${esc(JSON.stringify(d.diagnostyka, null, 2))}</pre>` : '';
      $('out').innerHTML = `<div class="err">${esc(d.error || 'Coś poszło nie tak.')}${diag}</div>`; return;
    }

    const res = d.results || [];
    shownIds = shownIds.concat(res.map(p => p.id).filter(Boolean));

    if(!more){
      $('note').textContent = res.length
        ? `${res.length} ${res.length===1?'osoba':res.length<5?'osoby':'osób'} z ${d.total} w bazie`
        : '';
      $('out').innerHTML = res.length
        ? res.map(card).join('')
        : `<div class="empty">Nikt sensownie nie pasuje do tego zapytania.<br>Spróbuj opisać to inaczej albo szerzej.</div>`;
    }else{
      if(oldMoreBtn) oldMoreBtn.remove();
      if(!res.length){ $('note').textContent += ' — to już wszystkie sensowne dopasowania.'; return; }
      const shownBefore = shownIds.length - res.length;
      $('out').insertAdjacentHTML('beforeend', res.map((p,i) => card(p, shownBefore + i)).join(''));
    }
    if(res.length && shownIds.length < d.total) $('out').insertAdjacentHTML('beforeend', moreBtnHtml);
  }catch(e){
    if(spin) clearInterval(spin);
    if(!more) $('out').innerHTML = `<div class="err">Brak połączenia. Sprawdź internet i spróbuj ponownie.</div>`;
    else if(oldMoreBtn){ oldMoreBtn.disabled = false; oldMoreBtn.textContent = 'Pokaż inne dopasowania'; }
  }finally{
    busy = false; $('go').disabled = false;
  }
}

$('selfToggle').addEventListener('click', () => {
  $('selfToggle').classList.add('hide');
  $('selfForm').classList.remove('hide');
  $('selfInfo').focus();
});
$('selfGo').addEventListener('click', () => {
  const info = $('selfInfo').value.trim();
  const li = $('selfLinkedin').value.trim();
  if(!info || !li) return;
  const body = `O sobie:\n${info}\n\nLinkedIn:\n${li}`;
  window.location.href = `mailto:paweljuzekk@gmail.com?subject=${encodeURIComponent('Dopisz mnie - Future Camp')}&body=${encodeURIComponent(body)}`;
});

$('go').addEventListener('click', () => search(false));
$('q').addEventListener('keydown', e => {
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter') search(false);
});
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(chip){ $('q').value = chip.dataset.q || chip.textContent; search(false); return; }
  const m = e.target.closest('#moreBtn');
  if(m) search(true);
  const askT = e.target.closest('.ask-toggle');
  if(askT) askT.nextElementSibling.classList.toggle('hide');
});
</script>
</body>
</html>
